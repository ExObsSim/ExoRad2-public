# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      # setuptools-scm needs tags + history to resolve the version;
      # Read the Docs does a shallow clone by default.
      - git fetch --tags --unshallow || git fetch --tags || true
    post_install:
      # Install the package together with its documentation dependencies
      - pip install -e ".[docs]"

sphinx:
  configuration: docs/source/conf.py

formats:
  - pdf
  - epub
